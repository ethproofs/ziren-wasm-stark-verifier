[package]
name = "ziren-wasm-stark-verifier"
edition = "2021"
version = "0.2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zkm-verifier.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"

# Console logging for debugging
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

# getrandom 0.2 (pulled in transitively via rand_core 0.6) refuses to compile on
# wasm32-unknown-unknown unless its "js" feature is enabled.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Optimize release builds
[profile.release]
opt-level = "s"
lto = true
